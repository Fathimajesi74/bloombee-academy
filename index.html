<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BLOOMBEE | Tutor Management</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


    <div class="app">


        <!-- HEADER -->

        <header class="header">

            <div class="logo-box">

                <img src="assets/logo.jpeg" alt="BLOOMBEE Logo">

                <h1>BLOOMBEE</h1>

            </div>


            <p>
                Tutor Management System
            </p>


            <small>
            Tutor: Zahirath Farhana
        </small>

        </header>



        <!-- MAIN -->

        <main>


            <!-- HOME -->

            <section id="home" class="page active">


                <h2 id="greeting">

                    👋 Welcome

                </h2>


                <div class="dashboard">


                    <div class="box">

                        <h3>
                            👨‍🎓
                        </h3>

                        <h2 id="totalStudents">
                            0
                        </h2>

                        <p>
                            Students
                        </p>

                    </div>



                    <div class="box">

                        <h3>
                            ✅
                        </h3>

                        <h2 id="presentCount">
                            0
                        </h2>

                        <p>
                            Present Today
                        </p>

                    </div>



                    <div class="box">

                        <h3>
                            ❌
                        </h3>

                        <h2 id="absentCount">
                            0
                        </h2>

                        <p>
                            Absent Today
                        </p>

                    </div>



                    <div class="box">

                        <h3>
                            💰
                        </h3>

                        <h2 id="pendingFees">
                            ₹0
                        </h2>

                        <p>
                            Pending Fees
                        </p>

                    </div>


                </div>


                <button class="primary-btn" onclick="openPage('students')">

                ➕ Add Student

            </button>


            </section>



            <!-- STUDENTS -->

            <section id="students" class="page">


                <h2>
                    👨‍🎓 Students
                </h2>


                <div class="student-form">


                    <label for="studentName">

                    Student Name

                </label>

                    <input id="studentName" type="text" placeholder="Enter student name">



                    <label for="studentClass">

                    Class

                </label>

                    <select id="studentClass">

                    <option>LKG</option>

                    <option>UKG</option>

                    <option>Class 1</option>

                    <option>Class 2</option>

                    <option>Class 3</option>

                    <option>Class 4</option>

                    <option>Class 5</option>

                    <option>Class 6</option>

                    <option>Class 7</option>

                    <option>Class 8</option>

                </select>



                    <label for="parentName">

                    Parent Name

                </label>

                    <input id="parentName" type="text" placeholder="Enter parent name">



                    <label for="phone">

                    Parent Phone

                </label>

                    <input id="phone" type="tel" placeholder="Enter phone number">



                    <label for="joiningDate">

                    Joining Date

                </label>

                    <input id="joiningDate" type="date">



                    <label for="fee">

                    Monthly Fee

                </label>

                    <input id="fee" type="number" min="0" placeholder="Enter monthly fee">



                    <button onclick="addStudent()">

                    ➕ Add Student

                </button>


                </div>



                <input id="search" type="text" placeholder="🔍 Search student" onkeyup="displayStudents()">



                <div id="studentList">

                </div>


            </section>



            <!-- ATTENDANCE -->

            <section id="attendance" class="page">


                <h2>
                    📅 Attendance
                </h2>


                <div class="attendance-box">


                    <label for="attendanceDate">

                    Select Date

                </label>


                    <input id="attendanceDate" type="date">
                    <label for="dailyClasses">Classes Today</label>
                    <select id="dailyClasses" onchange="loadAttendance()">
                        <option value="1">1 Class</option>
                        <option value="2">2 Classes</option>
                    </select>



                    <button onclick="markAllPresent()">

                    ✅ Mark All Present

                </button>



                    <button type="button" onclick="toggleHoliday()">

                    🏖 Mark / Remove Holiday

                </button>


                </div>







                <div id="holidayMessage">

                </div>



                <div id="attendanceList">

                </div>


            </section>




            <!-- FEES -->

            <section id="fees" class="page">


                <h2>
                    💰 Fees
                </h2>


                <label for="feeFilter">

                Filter by Class

            </label>


                <select id="feeFilter" onchange="displayFees()">


                <option value="All">

                    All Classes

                </option>


                <option value="LKG">

                    LKG

                </option>


                <option value="UKG">

                    UKG

                </option>


                <option value="Class 1">

                    Class 1

                </option>


                <option value="Class 2">

                    Class 2

                </option>


                <option value="Class 3">

                    Class 3

                </option>


                <option value="Class 4">

                    Class 4

                </option>


                <option value="Class 5">

                    Class 5

                </option>


                <option value="Class 6">

                    Class 6

                </option>


                <option value="Class 7">

                    Class 7

                </option>


                <option value="Class 8">

                    Class 8

                </option>


            </select>



                <div id="feeList">

                </div>


            </section>



            <!-- REPORTS -->

            <section id="reports" class="page">


                <h2>
                    📊 Reports
                </h2>


                <button class="primary-btn" onclick="generateStudentReport()">

                📄 Print Student Report

            </button>


            </section>



            <!-- SETTINGS -->

            <section id="settings" class="page">


                <h2>
                    ⚙ Settings
                </h2>


                <div class="student-form">


                    <label for="academy-name">
                    Academy Name
                </label>

                    <input id="academy-name" value="BLOOMBEE" readonly>



                    <label for="tutor-name">
                    Tutor Name
                </label>

                    <input id="tutor-name" value="Zahirath Farhana" readonly>



                    <label for="phone-number">
                    Phone
                </label>

                    <input id="phone-number" value="7019891083" readonly>



                    <label for="whatsapp-number">
                    WhatsApp
                </label>

                    <input id="whatsapp-number" value="7019891083" readonly>



                    <label for="classes-range">
                    Classes
                </label>

                    <input id="classes-range" value="LKG to Class 8" readonly>


                </div>


            </section>


        </main>



        <!-- BOTTOM NAVIGATION -->

        <nav class="bottom-nav">


            <button onclick="openPage('home')">

            🏠

            <span>
                Home
            </span>

        </button>



            <button onclick="openPage('students')">

            👨‍🎓

            <span>
                Students
            </span>

        </button>



            <button onclick="openPage('attendance')">

            📅

            <span>
                Attendance
            </span>

        </button>



            <button onclick="openPage('fees')">

            💰

            <span>
                Fees
            </span>

        </button>



            <button onclick="openPage('reports')">

            📊

            <span>
                Reports
            </span>

        </button>



            <button onclick="openPage('settings')">

            ⚙

            <span>
                Settings
            </span>

        </button>


        </nav>


    </div>



    <!-- JAVASCRIPT FILES -->

    <script src="js/app.js"></script>

    <script src="js/students.js"></script>

    <script src="js/attendance.js"></script>

    <script src="js/fees.js"></script>

    <script src="js/reports.js"></script>


</body>

</html>
